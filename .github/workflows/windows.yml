name: Windows x64 installer
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          path: vcpkg
      - name: Bootstrap vcpkg and install manifest
        shell: pwsh
        run: |
          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          .\vcpkg\vcpkg.exe install --triplet x64-windows
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
      - name: Configure and build
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 -DCMAKE_TOOLCHAIN_FILE=vcpkg/scripts/buildsystems/vcpkg.cmake
          cmake --build build --config Release
          cmake --install build --config Release --prefix dist
          Copy-Item vcpkg/installed/x64-windows/bin/*.dll dist/
          windeployqt --qmldir qml dist/SuEmby.exe
      - run: choco install innosetup --yes --no-progress
      - run: iscc installer/suemby.iss
      - uses: actions/upload-artifact@v4
        with:
          name: SuEmby-Setup
          path: Output/SuEmby-Setup.exe
